repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # --strict also fails a config that merely needs migration, not only one
  # that errors. --no-global reads the file as repository configuration;
  # the default reads it as global config and misreports repository fields.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.51.2
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # Renovate's pre-commit manager tracks only hooks carrying a `rev:`, so
  # these two are pinned in the CI workflow's pre-commit job instead.
  - repo: local
    hooks:
      - id: fourmolu
        name: fourmolu
        entry: fourmolu --mode inplace
        language: system
        types: [haskell]
      - id: hlint
        name: hlint
        entry: hlint
        language: system
        types: [haskell]

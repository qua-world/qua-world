# Rules keep the severity their package ships. Answer a finding by
# rewriting the prose rather than demoting the rule.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, proselint, alex
Vocab = partir-qua-world

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex
proselint.Cliches = NO     # Microsoft.Terms covers the same ground
proselint.Spelling = NO    # Vale.Spelling owns spelling

# CODE_OF_CONDUCT.md is the Contributor Covenant, quoted verbatim.
[CODE_OF_CONDUCT.md]
BasedOnStyles =

# `vale sync` vendors each package's own documentation under StylesPath.
[.vale/styles/**]
BasedOnStyles =

# hpc-codecov reports every module the .tix names, the test suite included.
# "test/**/*" would compile to a regex requiring a further slash, missing
# test/Spec.hs.
ignore:
  - "test/**"

coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        threshold: 1%

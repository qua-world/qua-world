# hpc-codecov reports the test modules alongside the library's.
# "test/**/*" would compile to a regex requiring a further slash, missing
# test/Spec.hs.
ignore:
  - "test/**"
  # Every line of this module is an OpenGL call, which needs a live context
  # the test suite has none of. What the renderer decides before it reaches
  # one lives in Partir.Client.GLUT.View and is measured there. #95 brings
  # the check a renderer can actually have, by comparing captured frames.
  - "app/Partir/Client/GLUT/Render.hs"

coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        threshold: 1%

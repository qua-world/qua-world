# CONTRIBUTING.md defines each type and starts subjects with a capital.
extends:
  - "@commitlint/config-conventional"
rules:
  subject-case: [0]
  type-enum:
    - 2
    - always
    - [add, change, deprecate, remove, fix, security, chore]

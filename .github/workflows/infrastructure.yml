name: Infrastructure

# The read-write deployer admits any job in this file that runs on develop, so
# only the apply job runs there.
on:
  push:
    branches: [develop]
    paths:
      - terraform/infrastructure/**
      - .github/workflows/infrastructure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Apply the infrastructure layer
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # Shared with the pull request plan so a plan never reads state mid-write.
    # queue: max also forbids cancelling an apply in progress, which would
    # orphan its lock.
    concurrency:
      group: terraform-state
      queue: max

    permissions:
      contents: read
      id-token: write
      issues: write

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: "1.17.2"

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # terraform/bootstrap/ admits this file by name, on develop alone. A
      # dispatch from another ref fails here, and a rename needs the new name in
      # that allowlist first.
      - name: Authenticate as the read-write deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_RW_EMAIL }}

      - name: Read the apply App's credentials
        id: app
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            id:qua-world-infrastructure/terraform-github-app-id-rw
            private-key:qua-world-infrastructure/terraform-github-app-private-key-rw

      - name: Mint the apply App's token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ steps.app.outputs.id }}
          private-key: ${{ steps.app.outputs.private-key }}
          owner: ${{ github.repository_owner }}

      - name: Initialize Terraform
        run: terraform init -input=false

      # Applying the saved plan keeps the logged plan and the applied change
      # identical.
      - name: Plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform apply -input=false -no-color tfplan

      # GitHub emails a failed run only to its triggering account. When a bot
      # triggers the apply, this report is the only notice the admin gets.
      - name: Report the failure to the admin
        if: failure() && github.ref == 'refs/heads/develop'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Must match CODEOWNERS. github.repository_owner is the org, not a user.
            const admin = 'alunduil';
            const title = 'Infrastructure apply failed on develop';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Apply run ${run} failed (triggered by \`${context.actor}\`).`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              creator: 'github-actions[bot]',
            });
            const report = openIssues.find((i) => !i.pull_request && i.title === title);
            if (report) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: report.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                assignees: [admin],
                labels: ['bug'],
              });
            }

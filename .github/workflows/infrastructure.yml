name: Infrastructure

# Bootstrap applies by hand, since the deployers cannot reach its state, so
# only terraform/infrastructure/ runs here.
#
# The read-write deployer admits any job in this file running on develop, so
# every job but the apply stays on pull requests.
on:
  pull_request:
    branches: [develop]
    # Shared so a pull request never plans a change its merge won't apply.
    paths: &infrastructure-paths
      - terraform/infrastructure/**
      - .github/workflows/infrastructure.yml
  push:
    branches: [develop]
    paths: *infrastructure-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Plan the infrastructure layer
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    # GitHub already withholds OIDC tokens from forks; this skips the job
    # rather than letting it fail at authentication.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    # The read-only deployer cannot write a lock, so plan runs -lock=false and
    # waits out any apply in this group instead. queue: max keeps every waiting
    # run rather than cancelling all but the newest.
    concurrency:
      group: terraform-state
      queue: max

    permissions:
      contents: read
      id-token: write

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: "1.17.1"

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate as the read-only deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_RO_EMAIL }}

      - name: Read the plan App's credentials
        id: app
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            id:qua-world-infrastructure/terraform-github-app-id-ro
            private-key:qua-world-infrastructure/terraform-github-app-private-key-ro

      # Without owner the token covers this repository alone and carries none
      # of the App's organization permissions.
      - name: Mint the plan App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.app.outputs.id }}
          private-key: ${{ steps.app.outputs.private-key }}
          owner: ${{ github.repository_owner }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan
          {
            echo '## Infrastructure plan'
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

  terraform-apply:
    name: Apply the infrastructure layer
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    if: github.event_name != 'pull_request'

    # Shared with the plan so a plan never reads state mid-write. queue: max
    # also forbids cancelling an apply in progress, which would orphan its lock.
    concurrency:
      group: terraform-state
      queue: max

    permissions:
      contents: read
      id-token: write

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: "1.17.1"

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # The read-write deployer admits this file on develop alone, so a
      # dispatch from any other ref fails here. Renaming the file means adding
      # the new name to terraform/bootstrap/'s allowlist first.
      - name: Authenticate as the read-write deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_RW_EMAIL }}

      - name: Read the apply App's credentials
        id: app
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            id:qua-world-infrastructure/terraform-github-app-id-rw
            private-key:qua-world-infrastructure/terraform-github-app-private-key-rw

      - name: Mint the apply App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.app.outputs.id }}
          private-key: ${{ steps.app.outputs.private-key }}
          owner: ${{ github.repository_owner }}

      - name: Initialize Terraform
        run: terraform init -input=false

      # Applying the saved plan keeps the logged plan and the applied change
      # identical.
      - name: Plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform apply -input=false -no-color tfplan

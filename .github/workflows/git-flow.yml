name: Git flow

# Retargeting a pull request fires only edited. A pass recorded against the
# old base would otherwise satisfy the new base's ruleset.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  git-flow-source:
    name: Check Git flow source branch
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/check-git-flow-source.sh "$BASE_REF" "$HEAD_REF"

name: Deployer access

# Bootstrap applies by hand, so a run on merge would race it. Dispatch after
# scripts/bootstrap.sh to confirm CI can reach the infrastructure state.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-deployer-access:
    name: Check read-write deployer access
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      # The deployer's Workload Identity binding admits only refs/heads/develop,
      # so a dispatch from any other ref fails here.
      - name: Authenticate as the read-write deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_RW_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: List the infrastructure state bucket
        run: gcloud storage ls gs://qua-world-infrastructure-tfstate

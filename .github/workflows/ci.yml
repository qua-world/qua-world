name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master, release/**]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    # Renovate's pre-commit manager tracks only hooks carrying a `rev:`, so
    # the hooks that run from PATH are pinned here instead.
    #
    # Both tools version with PVP. The default versioning coerces those
    # four-component releases to semver and reports them unstable, which
    # `ignoreUnstable` then hides. `loose` compares them component-wise.
    env:
      # renovate: datasource=github-releases depName=fourmolu/fourmolu versioning=loose extractVersion=^v(?<version>.+)$
      FOURMOLU_VERSION: "0.20.1.0"
      # renovate: datasource=github-releases depName=ndmitchell/hlint versioning=loose extractVersion=^v(?<version>.+)$
      HLINT_VERSION: "3.10"
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: "1.17.1"
      # renovate: datasource=github-releases depName=casey/just
      JUST_VERSION: "1.59.0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Fourmolu
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/fourmolu.zip \
            "https://github.com/fourmolu/fourmolu/releases/download/v${FOURMOLU_VERSION}/fourmolu-${FOURMOLU_VERSION}-linux-x86_64.zip"
          unzip -j /tmp/fourmolu.zip '*/fourmolu' -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10
        with:
          version: ${{ env.HLINT_VERSION }}

      - name: Install just
        run: |
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # Nothing reads the wrapper's step outputs.
          terraform_wrapper: false

      - name: Run pre-commit
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

  # terraform validate needs an initialized working directory, which the commit
  # hooks lack. Initializing without a backend needs no credentials.
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: "1.17.1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate
        run: |
          for layer in terraform/*/; do
            terraform -chdir="${layer}" init -backend=false -input=false
            terraform -chdir="${layer}" validate
          done

  # A required check skipped by a trigger's paths: filter stays pending
  # forever, so the plan is gated on this job's output instead. Deciding here
  # also keeps a pull request that plans nothing out of the plan's
  # terraform-state queue.
  infrastructure-changes:
    name: Detect infrastructure changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    outputs:
      plan: ${{ steps.diff.outputs.plan }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Diff against the apply trigger's paths
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          plan=$(scripts/detect-infrastructure-changes.sh "$BASE_REF" "$SAME_REPOSITORY")
          echo "plan=${plan}" >>"$GITHUB_OUTPUT"

  terraform-plan:
    name: Plan the infrastructure layer
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    needs: infrastructure-changes
    if: needs.infrastructure-changes.outputs.plan == 'true'

    # The read-only deployer cannot write a lock, so plan runs -lock=false and
    # queues behind any apply instead.
    concurrency:
      group: terraform-state
      queue: max

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: "1.17.1"

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate as the read-only deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_RO_EMAIL }}

      - name: Read the plan App's credentials
        id: app
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            id:qua-world-infrastructure/terraform-github-app-id-ro
            private-key:qua-world-infrastructure/terraform-github-app-private-key-ro

      # Without owner, the token covers this repository alone and none of the
      # App's organization permissions.
      - name: Mint the plan App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.app.outputs.id }}
          private-key: ${{ steps.app.outputs.private-key }}
          owner: ${{ github.repository_owner }}

      - name: Initialize Terraform
        run: terraform init -input=false

      # GitHub hides merge settings and ruleset bypass actors from a read-only
      # token, so a refresh reads them as blank and plans false changes. This
      # plan misses changes made outside Terraform; apply's refresh sees them.
      #
      # -detailed-exitcode exits 2 on a plan with changes and 1 on an error.
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          status=0
          terraform plan -input=false -lock=false -refresh=false -no-color -detailed-exitcode -out=tfplan || status=$?
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          terraform show -no-color tfplan >"${GITHUB_WORKSPACE}/plan.txt"
          if [ "$status" -eq 2 ]; then
            echo changes=true >>"$GITHUB_OUTPUT"
          else
            echo changes=false >>"$GITHUB_OUTPUT"
          fi

      - name: Comment the plan on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summaryLine = plan.match(/^(No changes\..+|Plan: .+)$/m);
            const summary = summaryLine ? summaryLine[0] : 'Plan generated';
            // GitHub rejects a comment over 65,536 characters; the Plan step's
            // log keeps the whole plan.
            const limit = 60000;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shown = plan.length > limit
              ? `${plan.slice(0, limit)}\n… truncated; the full plan is in ${run}`
              : plan;
            const marker = '<!-- terraform-plan:infrastructure -->';
            const body = [
              marker,
              '## Terraform plan: infrastructure',
              '',
              `**${summary}**`,
              '',
              '<details>',
              '<summary>Show full plan output</summary>',
              '',
              '```',
              shown,
              '```',
              '</details>',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # A dependency update is meant to change nothing live, and merging
      # applies its plan. This step follows the comment so a failure still
      # shows what the update would change.
      - name: Fail a dependency update whose plan changes resources
        if: >-
          steps.plan.outputs.changes == 'true' && (
            github.event.pull_request.user.login == 'renovate[bot]' ||
            contains(github.event.pull_request.labels.*.name, 'dependencies')
          )
        run: |
          echo "::error::This dependency update changes resources; see the plan comment."
          exit 1

  scripts:
    name: Test shell scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The helper libraries stay off: the suite asserts with plain bash, and
      # each one installed is another version to pin and track.
      - name: Set up bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Test
        run: bats scripts

  build:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      # Weeder reads HIE files only from the GHC it was built against, and
      # ships no binaries to download in place of building it.
      #
      # renovate: datasource=hackage depName=weeder versioning=loose
      WEEDER_VERSION: "2.10.0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The partir executable links GLUT and OpenGL, so freeglut and the
      # GLU headers must be present before cabal builds it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev

      - name: Set up GHC
        id: setup
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          # renovate: datasource=endoflife-date depName=ghc versioning=loose
          ghc-version: "9.10"
          cabal-version: latest

      - name: Check tested-with matches the installed GHC
        env:
          GHC_VERSION: ${{ steps.setup.outputs.ghc-version }}
        run: scripts/check-tested-with.sh "$GHC_VERSION"

      - name: Update Hackage index
        run: cabal update

      - name: Generate build plan
        run: cabal build all --enable-tests --dry-run

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          # The store holds weeder's dependency tree too, and a weeder bump
          # moves nothing in the build plan.
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}-weeder-${{ env.WEEDER_VERSION }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        run: cabal build all --enable-tests --only-dependencies

      # Before the cache save, so the store keeps what this builds.
      - name: Install weeder
        run: |
          cabal install "weeder-${WEEDER_VERSION}" --ignore-project --installdir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --enable-tests --test-show-details=direct

      # After the test run so a weed never masks a failing test.
      - name: Check for dead code
        run: weeder

  windows:
    name: Set up GHC on Windows
    runs-on: windows-2025
    timeout-minutes: 15

    # Native libraries come from MSYS2's clang64 environment, which matches
    # GHC's bundled toolchain: clang, lld, and compiler-rt against UCRT.
    steps:
      - name: Set up GHC
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          # renovate: datasource=endoflife-date depName=ghc versioning=loose
          ghc-version: "9.10"
          cabal-version: latest

      - name: Report GHC toolchain
        run: ghc --info

  coverage:
    name: Measure test coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev

      - name: Set up GHC
        id: setup
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          # renovate: datasource=endoflife-date depName=ghc versioning=loose
          ghc-version: "9.10"
          cabal-version: latest

      - name: Update Hackage index
        run: cabal update

      # Instrumentation recompiles this package alone, so the store the build
      # job saves already holds every dependency, and a second job writing
      # that key would race it. Nothing is saved under the key below, leaving
      # the prefix to land the store and `key` to repeat it.
      - name: Restore cabal store
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-
          restore-keys: ${{ env.key }}-

      # configure persists the flags to cabal.project.local, so the steps
      # below inherit the instrumentation.
      - name: Configure with coverage
        run: cabal configure --enable-tests --enable-coverage

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

      # hpc-codecov excludes only exact module names, so dropping the specs
      # here would mean naming each one. The glob in codecov.yml drops them
      # instead, and adding a spec needs no edit.
      - name: Generate coverage report
        id: report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: cabal:partir-qua-world-test

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          fail_ci_if_error: true

  appimage:
    name: Package the Linux AppImage
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    # An AppImage runs only on a glibc at least as new as its build's, so it
    # builds on the oldest glibc of any supported distro.
    container: almalinux:8@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342

    env:
      # A relocatable build of a library that depends on another in-place
      # library fails on cabal-install 3.16, and `latest` in
      # haskell-actions/setup can lag the newest release.
      #
      # Git tags carry release timestamps, which Hackage lacks, so a bump
      # waits out minimumReleaseAge while ghcup publishes its build.
      #
      # renovate: datasource=github-tags depName=haskell/cabal versioning=loose extractVersion=^cabal-install-v(?<version>\d+\.\d+\.\d+\.\d+)$
      CABAL_VERSION: "3.18.2.0"
      # renovate: datasource=github-releases depName=linuxdeploy/linuxdeploy versioning=loose
      LINUXDEPLOY_VERSION: "1-alpha-20251107-1"
      LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
      # linuxdeploy is itself an AppImage, and a container has no FUSE to
      # mount one with.
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - name: Install system dependencies
        run: |
          dnf -y install gcc gcc-c++ make gmp-devel ncurses-compat-libs \
            perl xz zlib-devel git file findutils which \
            freeglut-devel mesa-libGLU-devel

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up GHC
        id: setup
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          # renovate: datasource=endoflife-date depName=ghc versioning=loose
          ghc-version: "9.10"
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Update Hackage index
        run: cabal update

      - name: Generate build plan
        run: cabal build exe:partir-glut --dry-run

      # A store built on AlmaLinux cannot stand in for the Ubuntu jobs' stores,
      # so it keys apart from them.
      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        env:
          key: almalinux-8-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        run: cabal build exe:partir-glut --only-dependencies

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Install linuxdeploy
        run: |
          curl -fsSL -o /usr/local/bin/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  /usr/local/bin/linuxdeploy" | sha256sum -c -
          chmod +x /usr/local/bin/linuxdeploy

      - name: Package
        run: scripts/build-appimage.sh /usr/local/bin/linuxdeploy appimage

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: appimage/*.AppImage
          if-no-files-found: error

  appimage-launch:
    name: Launch the AppImage on stock Ubuntu
    needs: appimage
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    # A stock image has none of the libraries the AppImage carries, so a
    # missing one fails the launch.
    container: ubuntu:22.04@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6

    steps:
      # A player's desktop supplies the display and OpenGL driver.
      - name: Install a virtual display
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri

      - name: Check freeglut and GLU are absent
        run: |
          if ldconfig -p | grep -E 'libglut|libGLU'; then
            echo "::error::the launch image already carries freeglut or GLU"
            exit 1
          fi

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage

      # The client runs until its window closes, so a launch passes when the
      # timeout ends it.
      - name: Launch
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x ./*.AppImage
          status=0
          timeout 15 xvfb-run -a ./*.AppImage observe || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::the AppImage exited with status $status before the timeout"
            exit 1
          fi

  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - pre-commit
      - terraform-validate
      - infrastructure-changes
      - terraform-plan
      - scripts
      - build
      - windows
      - coverage
      - appimage
      - appimage-launch
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fail when any job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/check-ci-results.sh "$NEEDS"

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  pre-commit:
    name: pre-commit / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Renovate's pre-commit manager tracks only hooks carrying a `rev:`, so
    # the two hooks that run from PATH are pinned here instead.
    #
    # Both tools version with PVP. The default versioning coerces those
    # four-component releases to semver and reports them unstable, which
    # `ignoreUnstable` then hides. `loose` compares them component-wise.
    env:
      # renovate: datasource=github-releases depName=fourmolu/fourmolu versioning=loose extractVersion=^v(?<version>.+)$
      FOURMOLU_VERSION: "0.20.1.0"
      # renovate: datasource=github-releases depName=ndmitchell/hlint versioning=loose extractVersion=^v(?<version>.+)$
      HLINT_VERSION: "3.10"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Fourmolu
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/fourmolu.zip \
            "https://github.com/fourmolu/fourmolu/releases/download/v${FOURMOLU_VERSION}/fourmolu-${FOURMOLU_VERSION}-linux-x86_64.zip"
          unzip -j /tmp/fourmolu.zip '*/fourmolu' -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10
        with:
          version: ${{ env.HLINT_VERSION }}

      - name: Run pre-commit
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

  scripts:
    name: scripts / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint
        run: shellcheck scripts/*.sh

      # The helper libraries stay off: the suite asserts with plain bash, and
      # each one installed is another version to pin and track.
      - name: Set up bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Test
        run: bats scripts

  build:
    name: build / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The partir executable links GLUT and OpenGL, so freeglut and the
      # GLU headers must be present before cabal builds it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev

      - name: Set up GHC
        id: setup
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          # renovate: datasource=endoflife-date depName=ghc versioning=loose
          ghc-version: "9.10"
          cabal-version: latest

      - name: Check tested-with matches the installed GHC
        env:
          GHC_VERSION: ${{ steps.setup.outputs.ghc-version }}
        run: scripts/check-tested-with.sh "$GHC_VERSION"

      - name: Update Hackage index
        run: cabal update

      - name: Generate build plan
        run: cabal build all --enable-tests --dry-run

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        run: cabal build all --enable-tests --only-dependencies

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --enable-tests --test-show-details=direct

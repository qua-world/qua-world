name: Daily

on:
  schedule:
    # Offset from the hour: on-the-hour schedules queue behind platform
    # peak load.
    - cron: '47 6 * * *'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual dispatch during the scheduled run would sweep the same pull
  # requests twice, so runs queue rather than overlap.
  group: ${{ github.workflow }}

jobs:
  stale-pull-requests:
    name: Prune stale pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # `actions: write`, which the action recommends, only persists resume
      # state for runs that hit operations-per-run — beyond this repo's
      # pull request volume.
      issues: write
      pull-requests: write
    env:
      PR_STALE_DAYS: 30
      PR_CLOSE_DAYS: 14
    steps:
      # Disabling only `days-before-issue-stale` would still close issues
      # that already carry the label.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: ${{ env.PR_STALE_DAYS }}
          days-before-pr-close: ${{ env.PR_CLOSE_DAYS }}
          stale-pr-message: >-
            This has been quiet for ${{ env.PR_STALE_DAYS }} days, so it's
            picked up a stale label. A comment or a push clears the label and
            restarts the clock. Otherwise this closes in another
            ${{ env.PR_CLOSE_DAYS }} days.
          close-pr-message: >-
            Closing this after another ${{ env.PR_CLOSE_DAYS }} quiet days.
            That isn't a call on the change itself, and nothing is lost: the
            branch stays where it is, so comment here if you want to pick it
            back up and I'll reopen it.
